 - title: Pattern Recognition and Machine Learning
   authors: Christopher Bishop
   year: "2006"
   website: https://www.microsoft.com/en-us/research/people/cmbishop/prml-book/
   summary: 'Comprehensive introduction to pattern recognition and machine learning topics including linear models, neural networks, kernel methods, graphical models, and more.'

 - title: "Deep Learning: Foundations and Concepts"
   authors: Christopher Bishop and Hugh Bishop
   year: "2024"
   website: https://www.bishopbook.com
   summary: 'Breaks down the immense number of research works in machine and deep learning into components that effectively form the foundational building blocks of deep learning. Includes discussion of single- and multi-layer networks, backpropagation, regularization techniques, transformers, and more.'

 - title: Mathematics for Machine Learning
   authors: Marc Peter Deisenroth, A. Aldo Faisal, and Cheng Soon Ong
   year: "2020"
   website: https://mml-book.github.io
   summary: 'Provides a thorough, beginner-friendly introduction of the mathematics that define "machine learning" from the ground-up. The book is divided into two parts with the first focusing on mathematical foundations and the second on classical machine learning techniques.'

 - title: Bayesian Optimization
   authors: Roman Garnett
   year: "2023"
   website: https://bayesoptbook.com
   summary: 'Presents the Bayesian optimization paradigm from start-to-finish by defining each component of the approach, key design choices, and discussion of implementation details to go from theoretical to practical usage.'

 - title: Deep Learning
   authors: Ian Goodfellow, Yoshua Bengio, and Aaron Courville
   year: "2016"
   website: https://www.deeplearningbook.org
   summary: 'Introduces the mathematical frameworks used to define machine learning and extends it to explore topics within deep learning including deep networks, optimization for training deep models, convolutional and sequential networks, practical considerations, representation learning, inference, and more.'

 - title: The Elements of Statistical Learning
   authors: Trevor Hastie, Robert Tibshirani, and Jerome Friedman
   year: "2009"
   website: https://hastie.su.domains/ElemStatLearn/
   summary: 'Gives a statistical treatment of supervised and unsupervised learning techniques with emphasis placed on methods and concepts which define them. Topics include linear methods, kernel methods, model selection and evaluation, tree methods (incl. additive and boosting techniques), forests, ensemble methods, and more.'

 - title: An Introduction to Statistical Learning
   authors: Gareth James, Daniela Witten, Trevor Hastie, Robert Tibshirani, and
            Jonathan Taylor
   year: "2023"
   website: https://www.statlearning.com
   summary: 'Gives a statistical treatment of supervised and unsupervised learning, similar to that of <em>The Elements of Statistical Learning</em> but in a broader and less technical format to reduce the mathematical prerequisites required by the aforementioned text. Includes practical examples in Python and R.'

 - title: Numerical Optimization
   authors: Jorge Nocedal and Stephen Wright
   year: "2006"
   website: https://link.springer.com/book/10.1007/978-0-387-40065-5
   summary: 'Introduces the fundamental methods which form the field of numerical optimization, namely unconstrained and constrained optimization techniques including line search methods, trust region methods, quasi-Newton methods, derivative-free methods, linear and quadratic programming, and more.'

 - title: Gaussian Processes for Machine Learning
   authors: Carl Rasmussen and Christopher Williams
   year: "2008"
   website: https://gaussianprocess.org/gpml/
   summary: 'Presents the mathematical underpinnings of a key approach within Bayesian machine learning and optimization to learn a distribution of functions via a stochastic process which follows a form of the Gaussian distribution. Topics include practical applications such as regression and classification, covariance functions and kernels, approximation methods to scale to large datasets, and more.'

 - title: Mathematical Statistics and Data Analysis
   authors: John Rice
   year: "2007"
   website: https://www.stat.berkeley.edu/~rice/
   summary: 'Comprehensive reference text for data analysis which is interwoven with the field of statistics, often used as <em>the</em> textbook in many statistics courses. Topics include probability, random variables, joint distributions, expected values, limit theorems, distributions, experimental design, estimation techniques, hypothesis testing methods, data summarization and comparison methods, and more.'

 - title: "Artificial Intelligence: A Modern Approach"
   authors: Stuart Russel, Peter Norvig, and Ernest Davis
   year: "2010"
   website: https://aima.cs.berkeley.edu
   summary: 'A traditional treatment of artificial intelligence where the underlying theme revolves around the definition of an "intelligent agent". Topics include problem-solving and search methods, reasoning and planning techniques, uncertainty quantification and reasoning, learning methods, and how agents communicate, perceive, and act in their environments.'

 - title: "Reinforcement Learning: An Introduction"
   authors: Richard Sutton and Andrew Barto
   year: "2018"
   website: http://www.incompleteideas.net/book/the-book-2nd.html
   summary: 'Provides an introduction to core online learning techniques for reinforcement learning that covers topics including bandit problems, Markov decision processes, dynamic programming, Monte Carlo methods, approximate solution methods, and connections to other disciplines and practical applications.'